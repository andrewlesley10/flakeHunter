name: FlakeHunter CI Triage
description: Classify failing CI tests (product bug, flaky, environment, test code) and explain them on the pull request. Free, open models.
author: andrewlesley10
branding:
  icon: search
  color: orange

inputs:
  junit:
    description: Glob for JUnit XML reports, e.g. "reports/**/*.xml"
    required: true
  logs:
    description: Glob for raw log files (optional)
    required: false
    default: ""
  retry-report:
    description: Glob for JUnit XML from re-running the failed tests (optional; detects flaky tests)
    required: false
    default: ""
  model:
    description: GitHub Models model id
    required: false
    default: meta/llama-3.3-70b-instruct
  max-failures:
    description: Maximum number of failing tests to analyse per run
    required: false
    default: "10"
  label:
    description: Add the likely-flaky label when a flaky test is found ("true" or "false")
    required: false
    default: "true"
  use-llm:
    description: Ask the model about failures the rules can't settle ("true" or "false")
    required: false
    default: "true"
  github-token:
    description: Token for the GitHub API and GitHub Models (needs pull-requests write and models read)
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: false

    # Inputs are passed through env, never interpolated into the script (script injection).
    # "|| echo" keeps the user's build green even if installing FlakeHunter itself fails.
    - name: Run FlakeHunter
      shell: bash
      env:
        FH_JUNIT: ${{ inputs.junit }}
        FH_LOGS: ${{ inputs.logs }}
        FH_RETRY: ${{ inputs.retry-report }}
        FH_MODEL: ${{ inputs.model }}
        FH_MAX: ${{ inputs.max-failures }}
        FH_LABEL: ${{ inputs.label }}
        FH_USE_LLM: ${{ inputs.use-llm }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FLAKEHUNTER_PROVIDER: github-models
      run: |
        args=(github --junit "$FH_JUNIT" --logs "$FH_LOGS" --retry-report "$FH_RETRY"
              --model "$FH_MODEL" --max-failures "$FH_MAX" --label "$FH_LABEL")
        if [ "$FH_USE_LLM" != "true" ]; then args+=(--no-llm); fi
        uvx --quiet --from "$GITHUB_ACTION_PATH" flakehunter "${args[@]}" \
          || echo "::warning::FlakeHunter could not run; your build result is unaffected."
