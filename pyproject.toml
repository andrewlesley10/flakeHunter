[project]
name = "flakehunter"
version = "0.1.0"
description = "Classifies failing CI tests and explains each one on the pull request."
readme = "README.md"
authors = [
    { name = "andrewlesley10", email = "andrewlesley10@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "junitparser>=5.0.3",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
]

[project.scripts]
flakehunter = "flakehunter.cli:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["junitparser.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
